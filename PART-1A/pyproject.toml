[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-todo-api"
version = "0.1.0"
description = "A local JSON-backed todo API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "httpx2>=2.0",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
markers = ["performance: benchmark that verifies the 1,000-task latency target"]

