[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-reminder-agent"
version = "0.1.0"
description = "Deterministic natural-language reminder request to JSON agent"
requires-python = ">=3.11"
dependencies = [
    "dateparser>=1.2.0,<2",
    "jsonschema[format-nongpl]>=4.23,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "hypothesis>=6.100,<7",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "types-dateparser",
    "types-jsonschema",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "detect-secrets>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["reminder_agent.parser", "reminder_agent.validation", "reminder_agent.output"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_configs = true

